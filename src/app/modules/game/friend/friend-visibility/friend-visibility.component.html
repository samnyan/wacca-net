<h2>公開設定</h2>
<ul class="friend__friend-list-btn"><a routerLink="/web/friend/list" class="friend-list-link">
    <li class="friend-list-btn__list ">フレンドリスト</li>
</a> <a routerLink="/web/friend/visibility" class="friend-list-link">
    <li class="friend-list-btn__conf  active ">公開設定</li>
</a></ul>
<div class="friend__conf-ex">各データの公開範囲を設定できます。</div>
<div id="confirmForm">
    <ul class="friend__conf-options">
        <li><p>プレイヤーレベル</p>
            <ul class="filter-radio-wrap">
                <li class="radiobox"><input type="radio" name="playerLevel" id="radio1" value="1"> <label for="radio1">公開</label>
                </li>
                <li class="radiobox"><input type="radio" name="playerLevel" id="radio2" value="0" checked=""> <label
                        for="radio2">非公開</label></li>
            </ul>
        </li>
        <li><p>レーティング</p>
            <ul class="filter-radio-wrap">
                <li class="radiobox"><input type="radio" name="rating" id="radio2-1" value="1"> <label
                        for="radio2-1">公開</label></li>
                <li class="radiobox"><input type="radio" name="rating" id="radio2-2" value="0" checked=""> <label
                        for="radio2-2">非公開</label></li>
            </ul>
        </li>
        <li><p>ステージエンブレム</p>
            <ul class="filter-radio-wrap">
                <li class="radiobox"><input type="radio" name="stageup" id="radio3-1" value="1"> <label for="radio3-1">公開</label>
                </li>
                <li class="radiobox"><input type="radio" name="stageup" id="radio3-2" value="0" checked=""> <label
                        for="radio3-2">非公開</label></li>
            </ul>
        </li>
        <li><p>獲得クリアレート</p>
            <ul class="filter-radio-wrap">
                <li class="radiobox"><input type="radio" name="clearCount" id="radio4-1" value="1"> <label
                        for="radio4-1">公開</label></li>
                <li class="radiobox"><input type="radio" name="clearCount" id="radio4-2" value="0" checked=""> <label
                        for="radio4-2">非公開</label></li>
            </ul>
        </li>
        <li><p>スコアデータ</p>
            <ul class="filter-radio-wrap">
                <li class="radiobox"><input type="radio" name="score" id="radio5-1" value="1"> <label
                        for="radio5-1">公開</label></li>
                <li class="radiobox"><input type="radio" name="score" id="radio5-2" value="0" checked=""> <label
                        for="radio5-2">非公開</label></li>
            </ul>
        </li>
    </ul>
    <div class="friend__conf-ex"> ※スコアデータについて<br> 非公開の設定にすると<br> 「お気に入り」「スコア表示」の対象プレイヤーに<br> ならないようになります。
    </div>
    <a class="change-btn" routerLink="/web/friend/visibility/set">変更する</a></div>
